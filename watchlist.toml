# Configuration de la morning note : modifier librement les listes ci-dessous.
# symbol = ticker Yahoo Finance · name = libellé affiché · category = section de la note

[note]
title = "Morning note — Actions françaises"
author = "Valentin Knarov"
max_news_per_stock = 2
volume_alert = 2.0       # alerte si le volume du jour dépasse 2 fois la moyenne des 20 séances précédentes
move_alert_sigma = 2.0   # alerte si le mouvement dépasse 2 écarts-types journaliers

